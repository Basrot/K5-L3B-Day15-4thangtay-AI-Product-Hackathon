# Cost scenarios for a small pregnancy-CBC demo. Usage and adoption are explicit estimates,
# not observed user behavior; replace them if interview/survey evidence becomes available.

sessions: 50
seed: 42

users:
  low: 100
  base: 500
  high: 1500
  source: "(tự ước tính) quy mô người dùng beta hàng tháng thấp/cơ sở/cao; chưa có dữ liệu triển khai thực tế"

personas:
  - name: tra_cuu_mot_lan
    share: 0.5
    uses_per_month: 1
    turns_per_session: 1
    source: "(tự ước tính) người dùng xem một phiếu trong tháng; chưa xác thực qua phỏng vấn"
  - name: theo_doi_tai_kham
    share: 0.35
    uses_per_month: 2
    turns_per_session: 1
    source: "(tự ước tính) người dùng xem phiếu quanh hai lần khám trong tháng; chưa xác thực qua phỏng vấn"
  - name: hoi_nhieu_chi_so
    share: 0.15
    uses_per_month: 4
    turns_per_session: 2
    source: "(tự ước tính) người dùng hỏi lại về nhiều chỉ số; chưa xác thực qua phỏng vấn"

prices:
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · standard paid tier · checked 27/11/2026"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · standard paid tier · checked 27/11/2026; model rates cross-checked against further-reading/model-prices.md checked 25/11/2026"

# Token usage is measured on local qwen3:4b; the simulator prices that usage
# under the two hosted model rates above as an estimate, not a direct benchmark.
