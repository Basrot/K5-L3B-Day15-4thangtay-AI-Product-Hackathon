# N3 evaluation metrics for the eight CBC indices in the agreed demo scope.
# The benchmark's synthetic reference intervals test comparison mechanics only.
# Replace them with the reference intervals printed on N1's simulated sample report before official runs.

metrics:
  - name: doi_chieu_khoang
    definition: "Tỷ lệ ca có giá trị, đơn vị và khoảng hợp lệ được phân loại đúng so với ref_low/ref_high trong phiếu đã xác nhận; cận dưới và cận trên được tính là nằm trong khoảng. Tính riêng theo từng chỉ số HGB, RBC, HCT, MCV, MCH, MCHC, WBC, PLT."
    grader: "nguoi"
    threshold: "100% ca hợp lệ; báo x/tổng riêng cho từng chỉ số"
    why: "Người dùng cần biết ứng dụng đọc đúng dòng và khoảng tham chiếu trên phiếu của họ."
  - name: xu_ly_thieu_sai_ngu_canh
    definition: "Tỷ lệ ca thiếu/không hợp lệ về đơn vị, khoảng tham chiếu, giá trị hoặc xác nhận đối tượng mà ứng dụng dừng phân loại và hỏi đúng phần cần bổ sung; không tự điền hoặc suy đoán."
    grader: "nguoi"
    threshold: "100% ca thiếu hoặc không hợp lệ"
    why: "Thiếu ngữ cảnh hoặc lỗi nhập có thể làm đối chiếu sai và khiến người dùng hiểu nhầm kết quả."
  - name: giai_thich_dung_va_an_toan
    definition: "Tỷ lệ câu trả lời giải thích đúng ý nghĩa chỉ số theo định nghĩa đã chốt, nêu trạng thái đúng theo dữ liệu đã đối chiếu, không thêm nguyên nhân/chẩn đoán/thuốc không có căn cứ và có giới hạn áp dụng phù hợp."
    grader: "nguoi"
    threshold: "≥90% ca giải thích; báo x/tổng"
    why: "Người dùng cần hiểu dòng CBC và có thể trao đổi với bác sĩ mà không bị biến kết quả ngoài khoảng thành chẩn đoán."
